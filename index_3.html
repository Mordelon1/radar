<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Compra Ágil · Djanter (en línea)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233f51d6'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5fa;--surface:#fff;--text:#161a2b;--muted:#646b82;--border:#e3e6ef;--primary:#3f51d6;--primary-soft:#eceffd;--red:#c8323a;--shadow:0 1px 2px rgba(20,24,50,.05),0 4px 16px rgba(20,24,50,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1017;--surface:#161925;--text:#e8eaf2;--muted:#9aa1b8;--border:#272b3b;--primary:#7d8cff;--primary-soft:#1f2446;--red:#ff7b82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--primary);display:grid;place-items:center;flex:none}
h1{font-size:18px;margin:0}p.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.note{background:var(--primary-soft);border-radius:12px;padding:10px 14px;font-size:13px;margin:16px 0;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:15.5px}
.org{color:var(--muted);font-size:13px;margin-bottom:6px}
.meta{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;background:var(--primary-soft);color:var(--primary);font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;margin-right:6px}
.when{font-weight:600}.when.r{color:var(--red)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:24px 0}
a{color:var(--primary);text-decoration:none}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="white" stroke="none"/></svg></div>
<div><h1>Radar Compra Ágil · Djanter</h1><p class="sub">Oportunidades abiertas en Mercado Público · solo lectura</p></div></header>
<div class="note">Página generada automáticamente desde el radar local de Djanter. Para seguir una compra o ver precios de la competencia, se usa la app en el PC.</div>
<p class="meta" id="gen">Cargando…</p>
<div id="lista"></div>
<div class="foot">Radar Compra Ágil · Djanter</div>
</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clp(v){if(v==null)return"—";try{return "$"+Math.round(v).toLocaleString("es-CL")}catch(e){return "—"}}
function fFecha(v){if(!v)return"—";try{return new Date(v).toLocaleString("es-CL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return "—"}}
function hace(v){if(!v)return"nunca";const m=Math.round((Date.now()-new Date(v))/60000);if(m<1)return"recién";if(m<60)return m+" min";const h=Math.round(m/60);if(h<24)return h+" h";return Math.round(h/24)+" d"}
fetch("datos.json?_="+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById("gen").textContent="Actualizado hace "+hace(d.generado)+" · última revisión del radar: "+fFecha(d.stats.ultima_corrida);
  const L=(d.abiertas||[]).slice().sort((a,b)=>new Date(a.cierre||8.64e15)-new Date(b.cierre||8.64e15));
  if(!L.length){document.getElementById("lista").innerHTML='<div class="empty">Sin oportunidades abiertas por ahora.</div>';return}
  document.getElementById("lista").innerHTML=L.map(o=>{
    const cierra=o.cierre?new Date(o.cierre):null, pronto=cierra&&(cierra-Date.now())<864e5;
    return '<div class="card"><div>'+(o.nuevo?'<span class="chip">Nueva</span>':"")+
      '<span class="chip">'+esc(o.nombre_region||"")+'</span></div>'+
      '<h3><a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+esc(o.nombre)+'</a></h3>'+
      '<div class="org">'+esc(o.organismo||"")+'</div>'+
      '<div class="meta">Cierra: <span class="when '+(pronto?"r":"")+'">'+fFecha(o.cierre)+'</span> · '+clp(o.monto)+' · '+(o.ofertas??"—")+' oferta(s)</div></div>'
  }).join("")
}).catch(()=>{document.getElementById("gen").textContent="No se pudo cargar datos.json."});
</script>
</body>
</html>
